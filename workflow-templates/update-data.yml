name: Update Radar Data

on:
  schedule:
    - cron: "17 * * * *"
  workflow_dispatch:

permissions:
  contents: write

concurrency:
  group: radar-data-update
  cancel-in-progress: true

jobs:
  update-data:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-python@v5
        with:
          python-version: "3.11"

      - name: Generate data
        env:
          USE_MOCK_DATA: ${{ vars.USE_MOCK_DATA || 'true' }}
          API_FOOTBALL_KEY: ${{ secrets.API_FOOTBALL_KEY }}
          FOOTBALL_DATA_KEY: ${{ secrets.FOOTBALL_DATA_KEY }}
          ODDS_API_KEY: ${{ secrets.ODDS_API_KEY }}
        run: python scripts/generate_data.py

      - name: Run model tests
        run: python -m unittest discover -s tests -p "test_*.py"

      - name: Commit changed datasets
        run: |
          git config user.name "akimi-radar-bot"
          git config user.email "actions@github.com"
          git add public/data
          git diff --cached --quiet || git commit -m "chore(data): update radar datasets"
          git push
